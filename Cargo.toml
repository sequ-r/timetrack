[workspace]
resolver = "3"
members = [
    "crates/timetrack-core",
    "crates/timetrack-proto",
    "crates/timetrack-service",
    "crates/timetrack-cli",
    "crates/timetrack-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/sequ-r/timetrack"

[workspace.dependencies]
timetrack-core = { path = "crates/timetrack-core" }
timetrack-proto = { path = "crates/timetrack-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The "async-io" backend, NOT "tokio", and this is load-bearing.
#
# With zbus' tokio backend, `Transport::connect` calls
# `tokio::task::spawn_blocking`, which panics with "there is no reactor running"
# unless the calling thread is inside a tokio runtime.
#
# gpui itself calls zbus -- `gpui_ce_linux` does `ashpd::zbus::Connection::system()`
# for portals, from gpui's own executor threads, which have no tokio context and
# which we do not control. So enabling "tokio" here breaks gpui's startup, not
# just our own code. ashpd already selects the "async-io" backend, so this
# matches what gpui expects; the blocking/async-io backend connects from any
# thread.
#
# Consequence: the service and CLI must also stop relying on
# `#[tokio::main]`, since zbus no longer needs a tokio runtime. They use
# `async_io::block_on` instead -- see their main.rs.
zbus = { version = "5", default-features = false, features = ["async-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"

# gpui-ce publishes no crates.io build that includes the platform backend, so
# both crates are pinned to a single git rev. The platform crate is version
# 0.1.0 and is deliberately NOT kept in lockstep with gpui-ce's 0.2.x line.
[workspace.dependencies.gpui]
git = "https://github.com/gpui-ce/gpui-ce.git"
rev = "17d9c8e8fdb30a329d817ca06bff424e8e848f1a"
package = "gpui-ce"

[workspace.dependencies.gpui_platform]
git = "https://github.com/gpui-ce/gpui-ce.git"
rev = "17d9c8e8fdb30a329d817ca06bff424e8e848f1a"
package = "gpui_ce_platform"
features = ["font-kit", "wayland", "x11"]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
