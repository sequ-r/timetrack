[workspace]
resolver = "3"
members = [
    "crates/timetrack-core",
    "crates/timetrack-proto",
    "crates/timetrack-service",
    "crates/timetrack-cli",
    "crates/timetrack-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/sequ-r/timetrack"

[workspace.dependencies]
timetrack-core = { path = "crates/timetrack-core" }
timetrack-proto = { path = "crates/timetrack-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The "async-io" backend, NOT "tokio", and this is load-bearing.
#
# With zbus' tokio backend, `Transport::connect` calls
# `tokio::task::spawn_blocking`, which panics with "there is no reactor running"
# unless the calling thread is inside a tokio runtime.
#
# gpui itself calls zbus -- its Linux backend goes through ashpd for portals,
# from gpui's own executor threads, which have no tokio context and which we do
# not control. So enabling "tokio" here breaks gpui's startup, not just our own
# code. ashpd already selects the "async-io" backend, so this matches what gpui
# expects; the blocking/async-io backend connects from any thread.
#
# Consequence: the service and CLI must also stop relying on
# `#[tokio::main]`, since zbus no longer needs a tokio runtime. They use
# `async_io::block_on` instead -- see their main.rs.
zbus = { version = "5", default-features = false, features = ["async-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"

# Upstream gpui, as published from Zed. The community fork (gpui-ce) was only
# ever needed because the published crate carried no platform backend and had
# to be paired with a separate gpui_platform crate pinned to the same git rev.
# 0.2.2 ships the backends behind its default features -- font-kit, wayland and
# x11 -- so a single crates.io dependency replaces both of those.
gpui = "0.2.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
