[workspace]
resolver = "3"
members = [
    "crates/timetrack-core",
    "crates/timetrack-proto",
    "crates/timetrack-service",
    "crates/timetrack-cli",
    "crates/timetrack-gui",
    "crates/timetrack-tray",
    "crates/timetrack-update",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/sequ-r/timetrack"

[workspace.dependencies]
timetrack-core = { path = "crates/timetrack-core" }
timetrack-proto = { path = "crates/timetrack-proto" }
timetrack-update = { path = "crates/timetrack-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Our crates are on zbus 6; gpui and ashpd still pull zbus 5, so the two
# majors coexist in the tree and meet only on the wire. Feature choices
# here no longer reach gpui's copy, which keeps its own "async-io" backend
# (the zbus 5 arrangement this comment used to describe).
#
# zbus 6 has no backend feature to pick: a connection runs on zruntime
# (`default-rt`), making progress on threads inside its `block_on` and on
# a helper thread otherwise. That is what lets the service, the CLI and
# the tray keep driving zbus futures from `async_io::block_on` (see their
# main.rs) and the GUI from its own threads, exactly as under zbus 5's
# connect-from-any-thread backend.
#
# There is still deliberately **no tokio in this workspace at all**, and
# neither zbus' `tokio` feature nor a `#[tokio::main]` may appear. The one
# call site that reached for it -- `timetrack-proto`'s `wait_for_service`
# -- panicked with "there is no reactor running" whenever the session bus
# was absent, because it slept on `tokio::time` inside a program driven by
# `async_io::block_on`. Adding tokio back now has to be a deliberate edit
# to a crate's manifest, which is the point.
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy", "service"] }
async-io = "2"
# The `StreamExt`/`race` helpers for zbus signal streams (#103). Already in
# the tree as zbus' own dependency; naming it as ours is what lets
# `timetrack-proto` drive a `SignalStream` without client crates each
# having to learn a futures crate.
futures-lite = "2"
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1"

# Upstream gpui, as published from Zed. The community fork (gpui-ce) was only
# ever needed because the published crate carried no platform backend and had
# to be paired with a separate gpui_platform crate pinned to the same git rev.
# 0.2.2 ships the backends behind its default features -- font-kit, wayland and
# x11 -- so a single crates.io dependency replaces both of those.
gpui = "0.2.2"
# The lockfile holds libc at 0.2.189: 0.2.190 removed `ENOATTR` on Linux,
# which xattr 0.2.3 (gpui -> gpui_http_client -> zed-async-tar) still
# references. Re-pinning after a lockfile update looks like:
#   cargo update -p libc --precise 0.2.189
# Lift this when gpui's tree moves off xattr 0.2.3.
# StatusNotifierItem tray (issue #4 spike: async-io only -- never enable the
# default tokio feature, or ksni fails to compile by design and zbus would
# gain the tokio backend this workspace deliberately avoids).
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
