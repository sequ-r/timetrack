[workspace]
resolver = "3"
members = [
    "crates/timetrack-core",
    "crates/timetrack-proto",
    "crates/timetrack-service",
    "crates/timetrack-cli",
    "crates/timetrack-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/sequ-r/timetrack"

[workspace.dependencies]
timetrack-core = { path = "crates/timetrack-core" }
timetrack-proto = { path = "crates/timetrack-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# No "tokio" feature, deliberately.
#
# With zbus' tokio backend enabled, `Transport::connect` calls
# `tokio::task::spawn_blocking` from inside zbus' *own* executor thread, which
# has no tokio context -- it panics with "there is no reactor running, must be
# called from the context of a Tokio 1.x runtime". Driving it from a runtime on
# our side does not help, because the call happens on zbus' thread, not ours.
# Without the feature, zbus falls back to its blocking/async-io backend and
# the connection works from any thread.
#
# gpui pulls in async-io regardless, so this backend is available either way.
# The service and CLI use `#[tokio::main]` and are unaffected.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"

# gpui-ce publishes no crates.io build that includes the platform backend, so
# both crates are pinned to a single git rev. The platform crate is version
# 0.1.0 and is deliberately NOT kept in lockstep with gpui-ce's 0.2.x line.
[workspace.dependencies.gpui]
git = "https://github.com/gpui-ce/gpui-ce.git"
rev = "17d9c8e8fdb30a329d817ca06bff424e8e848f1a"
package = "gpui-ce"

[workspace.dependencies.gpui_platform]
git = "https://github.com/gpui-ce/gpui-ce.git"
rev = "17d9c8e8fdb30a329d817ca06bff424e8e848f1a"
package = "gpui_ce_platform"
features = ["font-kit", "wayland", "x11"]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
