name: ci

# The checks a change has to pass: rustfmt, clippy, the unit tests, the service
# end-to-end rig, and the headless GUI smoke check. This workflow is the only
# definition of them -- `release.yml` calls it, so a tag publishes nothing
# until these jobs pass on the tagged commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  # `github.workflow` is the caller's name inside a called workflow, so a
  # direct run (`ci-...`) and release.yml's reuse of this workflow
  # (`release-...`) never share a group: since the release now runs on every
  # push to `main`, sharing one would make the two runs cancel each other on
  # every merge. Cancelling only reaches runs of the same event on the same
  # ref, which is what a superseded push or pull request update is.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # gpui links these, and both clippy and `cargo test --workspace` build the GUI
  # crate along with the rest of the workspace, so every job that compiles the
  # workspace needs them -- without them the build fails, which reads as a
  # broken test rather than as a missing -dev package (README, "Building").
  GUI_LIBS: libxkbcommon-dev libxkbcommon-x11-dev libfreetype-dev libfontconfig-dev
  # The e2e rig drives a real service on a private session bus and reads
  # aggregate snapshots back through gdbus.
  RIG_TOOLS: dbus libglib2.0-bin
  # gui-smoke drives the real GUI on a headless X server, so it needs: Xvfb
  # itself; xdpyinfo to wait for it; setxkbmap, because an Xvfb server has no
  # keymap and every keysym lookup would otherwise return 0; ImageMagick to
  # read the pixels back; libXtst for the XTest helper the script compiles;
  # fonts for gpui to shape text with; and a software Vulkan driver, because
  # Xvfb implements no DRI3 and Mesa's GPU drivers need it to present.
  GUI_RIG: >-
    xvfb x11-utils x11-xserver-utils imagemagick libxtst-dev fonts-dejavu-core
    mesa-vulkan-drivers

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          components: rustfmt
          cache: "false" # formatting reads no dependencies
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          apt-packages: ${{ env.GUI_LIBS }}
          components: clippy
      # `--all-targets` covers the test helpers too, where the last batch of
      # warnings lived. `-D warnings` makes any new one fail the build.
      # The `portal-stub` feature compiles in the save-dialog stub the GUI
      # smoke check drives. It is on here so that code is linted, and it is
      # off in the release build, so a published binary has no stub to arm.
      - run: cargo clippy --workspace --all-targets --locked --features timetrack-gui/portal-stub -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          apt-packages: ${{ env.GUI_LIBS }}
      # `cargo test` compiles each binary's *test harness*, not the binary: the
      # tray's round-trip test (crates/timetrack-tray/tests/real_service.rs)
      # spawns `target/debug/timetrack-service`, so build it first, exactly as
      # that test's own failure message says to.
      - run: cargo build --locked --package timetrack-service
      - run: cargo test --workspace --locked --features timetrack-gui/portal-stub

  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Informational only (#111): the number exists so it can be watched, not
    # so it can gate. `continue-on-error` keeps a coverage-tooling failure
    # from reddening a change, and this job is deliberately absent from the
    # branch-protection required checks. The same commands run locally —
    # see "Coverage" in the README's Building section.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          apt-packages: ${{ env.GUI_LIBS }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The tray round-trip test spawns the real binaries from the profile
      # directory next to its test executable. Under llvm-cov that is
      # `target/llvm-cov-target/debug/`, and llvm-cov cleans that directory
      # before building — so pre-build the binaries into it and pass
      # --no-clean, or the round-trip test fails for a missing binary that
      # `cargo test` alone never produces there (same trap as `test` above).
      - run: >-
          cargo build --locked --package timetrack-service
          --package timetrack-tray --target-dir target/llvm-cov-target
      - run: >-
          cargo llvm-cov --no-clean --workspace --locked
          --features timetrack-gui/portal-stub --summary-only
      - run: cargo llvm-cov report --html --output-dir coverage-html
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-html
          path: coverage-html
          if-no-files-found: ignore

  e2e:
    name: e2e (service on a private bus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          apt-packages: ${{ env.RIG_TOOLS }}
      # The rig drives the release binaries, which is how the README tells a
      # person to run them. Neither the CLI nor the service pulls in gpui, so
      # this build is a fraction of the GUI one.
      - run: cargo build --release --locked --package timetrack-cli --package timetrack-service
      - run: bash scripts/e2e.sh

  gui-smoke:
    name: gui-smoke (headless GUI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          apt-packages: ${{ env.GUI_LIBS }} ${{ env.GUI_RIG }}
      # The smoke check starts all three binaries itself, so this is the whole
      # workspace in release mode -- the long build, and the one check that can
      # say the toolkit still paints, hit-tests and reads the keyboard.
      # The feature is what compiles in the save-dialog stub the smoke check
      # drives: no live portal exists on a headless X server. The release
      # workflow builds without it, so a published binary has no stub.
      - run: >-
          cargo build --release --locked
          --package timetrack-gui --package timetrack-service --package timetrack-cli
          --features timetrack-gui/portal-stub
      - name: Run the smoke check
        env:
          # A failed run copies its screenshots and logs here for the step
          # below: the runner's own /tmp does not outlive the job.
          TT_SMOKE_ARTIFACTS: ${{ runner.temp }}/gui-smoke-artifacts
        run: bash scripts/gui-smoke.sh
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: gui-smoke-failure
          path: ${{ runner.temp }}/gui-smoke-artifacts
          if-no-files-found: ignore
