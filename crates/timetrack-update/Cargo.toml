[package]
name = "timetrack-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-update logic for the TimeTrack AppImage (GitHub releases)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Blocking HTTPS with rustls. Blocking, because the GUI drives updates from a
# dedicated std::thread (like the export save), never from a gpui future -- and
# rustls, never tokio: this workspace has deliberately no tokio anywhere (see
# the workspace manifest for why it is load-bearing absent).
ureq = "3"
# Verify downloads against the release's SHA256SUMS before they may replace
# the running image. 0.10, not the also-locked 0.11: 0.10.9 is already in the
# tree under two dependents, 0.11.0 under one, and the API used here is the
# same -- so the older line adds no new package to the lock.
sha2 = "0.11"

[dev-dependencies]
# The local-server harness hashes the payloads it serves so it can publish a
# correct (or deliberately wrong) SHA256SUMS next to them.
sha2 = "0.11"
