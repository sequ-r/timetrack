[package]
name = "timetrack-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TimeTrack desktop client (gpui)"

# Named distinctly from the CLI's `timetrack` so the two workspace
# binaries do not collide in the shared target directory. The
# flatpak installs it as `timetrack`.
[[bin]]
name = "timetrack-gui"
path = "src/main.rs"

[dependencies]
timetrack-core = { workspace = true }
timetrack-proto = { workspace = true }
gpui = { workspace = true }
anyhow = { workspace = true }
async-io = "2"
