[package]
name = "timetrack-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TimeTrack desktop client (gpui)"

# Named distinctly from the CLI's `timetrack` so the two workspace
# binaries do not collide in the shared target directory.
[[bin]]
name = "timetrack-gui"
path = "src/main.rs"

[features]
default = []
# The headless GUI smoke check needs a save dialog it can drive, and there
# is no live portal on a headless X server. The stub that stands in for one
# is compiled in only when this feature is on, so a released binary cannot
# be talked into bypassing the system save dialog.
#
# The smoke check's build turns it on explicitly:
#   cargo build --release -p timetrack-gui --features timetrack-gui/portal-stub
portal-stub = []

[dependencies]
timetrack-core = { workspace = true }
timetrack-proto = { workspace = true }
timetrack-update = { workspace = true }
gpui = { workspace = true }
anyhow = { workspace = true }
async-io = { workspace = true }
# System save dialog via the desktop portal. Same
# backend as gpui itself: `async-std` selects zbus' async-io backend, never
# tokio (see the workspace manifest for why tokio is load-bearing absent).
ashpd = { version = "0.12", default-features = false, features = ["async-std"] }
