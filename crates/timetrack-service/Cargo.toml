[package]
name = "timetrack-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TimeTrack session service: owns the store and serves it over the local socket"

[[bin]]
name = "timetrack-service"
path = "src/main.rs"

[dependencies]
timetrack-core = { workspace = true }
timetrack-store = { workspace = true }
timetrack-proto = { workspace = true }
anyhow = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
# The rollback test holds a real SQLite write lock on the service's
# database from a second connection, so the persist failure it injects
# is SQLite's own, not a production test hook.
rusqlite = { workspace = true }