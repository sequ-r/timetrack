[package]
name = "timetrack-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared D-Bus contract and client for TimeTrack"

[dependencies]
timetrack-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zbus = { workspace = true }
async-io = { workspace = true }
futures-lite = { workspace = true }
anyhow = { workspace = true }

# Windows named pipes behind the same socket contract (§16). Sync API
# only: no async features, so no tokio enters through here either.
[target.'cfg(windows)'.dependencies]
interprocess = { version = "2", default-features = false }
